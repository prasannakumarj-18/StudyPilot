<!DOCTYPE html>

<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyPilot</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>StudyPilot</h1>
<p>AI Study Planning</p>

<h2>Create Study Plan</h2>

<label>Subject:</label>
<input type="text" id="subject">

<br><br>

<label>Number of Days:</label>
<input type="number" id="days">

<br><br>

<label>Hours Per Day:</label>
<input type="number" id="hours_per_day" step="0.5">

<br><br>

<button onclick="generatePlan()">Generate Study Plan</button>

<br><br>

<label>Saved Plan ID:</label>
<input type="number" id="plan_id">

<button onclick="loadSavedPlan()">Load Saved Plan</button>
<button onclick="loadProgress()">Load Progress</button>

<div id="plan"></div>

<script src="script.js"></script>
</body>

</html>
